name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Arrmada360.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arrmada360-apk
          path: Arrmada360.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Arrmada360.apk \
            --title "Arrmada360 – latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}. Download **Arrmada360.apk** below and open it on your Android phone to install or update." \
            --latest
